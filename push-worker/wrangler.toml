name = "planer-push"
main = "worker.js"
compatibility_date = "2026-01-01"

# Jede Minute nachsehen, ob eine Erinnerung fällig ist
[triggers]
crons = ["* * * * *"]

# Speicher für die Anmeldungen. Die id trägst du nach dem Anlegen ein:
#   npx wrangler kv namespace create PLANER
[[kv_namespaces]]
binding = "PLANER"
id = "HIER_DIE_ID_EINTRAGEN"

